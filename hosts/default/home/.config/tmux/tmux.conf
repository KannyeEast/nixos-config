# ── general ────────
set -g mouse on
set -g detach-on-destroy off      # closing the last session moves to another
set -g allow-passthrough on       # image protocols survive inside tmux
set -ga update-environment " NH_FLAKE"

# ── prefix ────────
unbind C-b
set -g prefix C-space
bind C-space send-prefix

# ── indexing ────────
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# ── status ────────
set -g status 2
set -g status-format[1] ""
set -g status-position top
set -g status-justify left
set -g status-style "bg=default,fg=colour8"
set -g status-left ""
set -g status-right "#[fg=#{?client_prefix,colour3,colour6}]#S "

setw -g window-status-format "#[fg=colour8]#I #W"
setw -g window-status-current-format "#[fg=#{?client_prefix,colour3,colour4},underscore]#I #W"
setw -g window-status-separator " "

set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour6"
set -g message-style "bg=default,fg=colour6"
set -g mode-style "bg=colour8,fg=default"

# ── windows ────────
bind -N "previous window" -n M-H previous-window
bind -N "next window" -n M-L next-window
bind -N "new window in cwd" c new-window -c "#{pane_current_path}"

# ── panes ────────
bind -N "split vertically, keep cwd" '|' split-window -h -c "#{pane_current_path}"
bind -N "split horizontally, keep cwd" - split-window -v -c "#{pane_current_path}"

bind -N "select pane left" h select-pane -L
bind -N "select pane down" j select-pane -D
bind -N "select pane up" k select-pane -U
bind -N "select pane right" l select-pane -R

bind -N "resize left" -r H resize-pane -L 5
bind -N "resize down" -r J resize-pane -D 5
bind -N "resize up" -r K resize-pane -U 5
bind -N "resize right" -r L resize-pane -R 5

# ── copy mode ────────
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ── help ────────
bind -N "cheatsheet" ? display-popup -E -w 70% -h 75% \
    "bat --style=plain --paging=always $NH_FLAKE/docs/keybinds.md"
bind -N "every binding" / display-popup -E -w 70% -h 75% \
    "tmux list-keys -N | less -R"

# ── misc ────────
bind -N "toggle the status bar" b set-option status