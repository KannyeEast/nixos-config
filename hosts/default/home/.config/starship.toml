"$schema" = 'https://starship.rs/config-schema.json'

# Colours are named so they resolve against the terminal palette. Set the
# palette once in the terminal (Poimandres) and prompt, fzf, eza and bat all
# follow. Nothing here needs touching for a theme change.

add_newline = true
scan_timeout = 30
command_timeout = 1000

format = """
$os$username$hostname$directory$git_branch$git_status$git_state$nix_shell
$character"""

right_format = "$cmd_duration"

# ── context line ────────
[os]
disabled = false
format = "[$symbol]($style) [∙](bright-black) "
style = "bold green"

[os.symbols]
NixOS = "󰊠"
Linux = "󰊠"

# Only appears as root or over SSH
[username]
show_always = false
format = "[$user]($style) "
style_root = "bold red"
style_user = "bold yellow"

[hostname]
ssh_only = false
format = "[$ssh_symbol$hostname]($style) "
style = "bold green"
ssh_symbol = "󰇧 "

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold blue"
read_only = " 󰌾"
read_only_style = "bold red"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Pictures" = ""

# ── git ────────
[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "bold purple"

[git_status]
format = "([$all_status$ahead_behind]($style))"
style = "bold yellow"
conflicted = "[~${count}](bold red) "
staged = "[+${count}](bold green) "
modified = "●${count} "
untracked = "?${count} "
deleted = "✘${count} "
renamed = "»${count} "
stashed = "≡${count} "
ahead = "[⇡${count}](bold blue) "
behind = "[⇣${count}](bold blue) "
diverged = "[⇡${ahead_count}⇣${behind_count}](bold blue) "

# rebase / merge / bisect state
[git_state]
format = '[$state( $progress_current/$progress_total)]($style) '
style = "bold red"
rebase = "rebase"
merge = "merge"
revert = "revert"
cherry_pick = "pick"
bisect = "bisect"

# ── environment ────────
[nix_shell]
format = "[$symbol$state]($style) "
symbol = " "
style = "bold cyan"
impure_msg = "nix"
pure_msg = "nix pure"
unknown_msg = "nix"
heuristic = true

[cmd_duration]
min_time = 2000
format = "[$duration]($style)"
style = "bright-black"

# ── prompt line ────────
[character]
success_symbol = "[❯](bold yellow)[❯](bold purple)[❯](bold blue)"
error_symbol = "[❯](bold red)[❯](bold red)[❯](bold red)"

# ── off ────────
# Language versions are noise; the nix shell already says what is available.
[rust]
disabled = true

[nodejs]
disabled = true

[python]
disabled = true

[golang]
disabled = true

[package]
disabled = true

# ── transient profile ────────
[profiles]
transient = "$character"
rtransient = "$time"

[time]
disabled = false
format = "[$time]($style)"
style = "bright-black"
time_format = "%H:%M"