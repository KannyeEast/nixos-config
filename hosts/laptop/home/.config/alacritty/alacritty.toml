[general]
live_config_reload = true
working_directory = "None"

# Generated from .config/theme/palette.json. tmux and starship read the ANSI
# palette back out of the terminal, so this is the only place it enters.
import = ["~/.config/theme/palette.toml"]

[terminal]
shell = { program = "zsh", args = ["-l", "-c", "tmux attach || tmux"] }

[window]
title = "Alacritty"
dynamic_title = true

decorations = "none"

opacity = 1

padding.x = 15
padding.y = 15

[window.dimensions]
columns = 160
lines = 80

[cursor.style]
shape= "Block"
blinking = "Never"

[colors]
#transparent_background_colors = true
draw_bold_text_with_bright_colors = true

[env]
TERM = "xterm-256color"

[font]
normal.family = "JetBrainsMonoNL Nerd Font Mono"
normal.style = "Regular"
size = 12.0

[font.bold]
family = "JetBrainsMonoNL Nerd Font Mono"
style = "Bold"

[font.italic]
family = "JetBrainsMonoNL Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMonoNL Nerd Font Mono"
style = "Bold Italic"

[colors.cursor]
cursor = "CellForeground"
text = "CellBackground"

[colors.selection]
text = "CellForeground"
background = "0x303340"

[colors.vi_mode_cursor]
text = "CellBackground"
cursor = "CellForeground"