scheme: "Litmus"
author: "KanyeSouth"

# Deliberately loud test scheme. Light background, saturated accents —
# if `just theme litmus switch` lands, every surface changes obviously.
# Not meant to be lived in.

# ── greyscale ramp ────────
base00: "f4f1e8" # default background
base01: "e8e4d8" # status bars, popups, inactive tabs
base02: "d8d2c2" # selection background, active line highlight
base03: "a8a293" # comments, disabled text, inactive borders
base04: "6e6a5e" # muted foreground — status bar text, secondary labels
base05: "3b3830" # default foreground — body text, cursor, punctuation
base06: "2a2822" # bright foreground — emphasis, hover text
base07: "1a1815" # lightest slot; inverted here, so it reads as darkest

# ── accents ────────
base08: "c1443b" # red — errors, deletions, urgent, close buttons
base09: "b06a1f" # orange — numbers, constants, warnings, modified state
base0A: "9a7d10" # yellow — classes, search match background, bold
base0B: "4f7a3a" # green — strings, additions, success, "ok" state
base0C: "2b7a80" # cyan — escapes, regex, info, links in some tools
base0D: "2f5fa8" # blue — the primary accent: focus, headings, functions
base0E: "8a4a9c" # magenta — keywords, changed state, italic
base0F: "8a5a3a" # brown — deprecated, embedded tags
