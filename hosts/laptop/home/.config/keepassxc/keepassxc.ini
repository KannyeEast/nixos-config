[General]
AutoGeneratePasswordForNewEntries=false
AutoTypeDelay=15
AutoTypeStartDelay=150
BackupBeforeSave=true
BackupFilePathPattern=~/Documents/Passwords/backup/{TIME:yyyyMMddhh}.old.kdbx
ConfigVersion=2
URLDoubleClickAction=1

[Browser]
BestMatchOnly=false
CustomProxyLocation=
Enabled=true
MatchUrlScheme=true
SearchInAllDatabases=true
UnlockDatabase=true

[FdoSecrets]
Enabled=true

[GUI]
ApplicationTheme=dark
ColorPasswords=true
MonospaceNotes=true
MovableToolbar=false
TrayIconAppearance=monochrome-light

[KeeShare]
Active="<?xml version=\"1.0\"?><KeeShare><Active/></KeeShare>\n"
Own="<?xml version=\"1.0\"?><KeeShare><PrivateKey></PrivateKey><PublicKey><Signer>gldn</Signer><Key></Key></PublicKey></KeeShare>\n"
QuietSuccess=true

[PasswordGenerator]
AdditionalChars="!\"#$%&()*+,-./:;<=>?@[\\]_{|}~"
AdvancedMode=true
ExcludedChars=\xb0`\xb4\xa7'^
Length=20

[Security]
ClearClipboardTimeout=30
ClearSearch=true
Enabled=true
IconDownloadFallback=true
LockDatabaseIdle=false
LockDatabaseMinimize=true
